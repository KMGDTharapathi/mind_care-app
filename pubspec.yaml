name: mind_care_app
description: "MindCare - A Flutter mental wellness application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^13.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  flutter_timezone: ^3.0.0
  timezone: ^0.9.4
  connectivity_plus: ^6.1.4
  http: ^1.2.1
  geolocator: ^13.0.2
  uuid: ^4.3.3
  wakelock_plus: ^1.2.0
  url_launcher: ^6.3.1
  add_2_calendar: ^3.0.1
  audioplayers: ^6.1.0
  file_picker: ^13.1.0
  image: ^4.2.0
  fl_chart: ^0.67.0
  flutter_staggered_grid_view: ^0.7.0
  intl: ^0.19.0
  flutter_svg: ^2.2.4
  audio_service: ^0.18.19
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  image_path: "assets/icon/logo.jpg"
  android:
    enabled: true
    min_sdk_android: 21
    adaptive_icon_background: "#B2DFDB"
    adaptive_icon_foreground: "assets/icon/logo.jpg"
  ios:
    enabled: true
    remove_alpha_ios: true
  windows:
    enabled: true
    icon_size: 256
  macos:
    enabled: true
  linux:
    enabled: true
  web:
    enabled: true
    background_color: "#B2DFDB"
    theme_color: "#004D40"

flutter:
  uses-material-design: true
  assets:
    - assets/coloring/
    - assets/coloring/mandala1.svg
    - assets/coloring/mandala2.svg
    - assets/coloring/mandala3.svg
    - assets/coloring/mandala4.svg
    - assets/coloring/mandala5.svg
    - assets/coloring/mandala6.svg
    - assets/audio/step_chime.wav
    - assets/audio/finish_chime.wav