name: mind_care_app
description: "MindCare - A Flutter mental wellness application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Navigation
  go_router: ^13.0.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4     #C1
  cloud_firestore: ^5.6.9
  firebase_analytics: ^11.4.4
  firebase_crashlytics: ^4.3.4
  firebase_remote_config: ^5.4.4
  firebase_messaging: ^15.2.5
  google_sign_in: ^6.2.2
  firebase_storage: ^12.3.1

  # Connectivity
  connectivity_plus: ^6.1.4

  # HTTP client
  http: ^1.2.1

  # Location
  geolocator: ^13.0.2

    # Utilities
  uuid: ^4.3.3
  wakelock_plus: ^1.2.0
  url_launcher: ^6.3.1
  add_2_calendar: ^3.0.1

  # Audio
  audioplayers: ^6.1.0
  audio_service: ^0.18.19

  # File picker
  file_picker: ^8.1.2

  # Image picking & processing
  image_picker: ^1.1.2
  image: ^4.2.0
  gal: ^2.3.3

  # Charts
  fl_chart: ^0.67.0

  # Staggered grid (Pinterest-style)
  flutter_staggered_grid_view: ^0.7.0

  # Internationalization (date formatting)
  intl: ^0.19.0
  flutter_svg: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation for Hive
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

  # Testing
  mocktail: ^1.0.3

flutter:
  uses-material-design: true

  assets:
    - assets/coloring/
    - assets/coloring/mandala1.svg
    - assets/coloring/mandala2.svg
    - assets/coloring/mandala3.svg
    - assets/coloring/mandala4.svg
    - assets/coloring/mandala5.svg
    - assets/coloring/mandala6.svg
    - assets/audio/
    - assets/images/