  <ellipse cx="100" cy="380" rx="20" ry="10" fill="#FFD54F" stroke="#F57F17" stroke-width="1"/>
  <path d="M120 380 L135 370 L135 390Z" fill="#FFD54F" stroke="#F57F17" stroke-width="1"/>
  <circle cx="108" cy="377" r="3" fill="#333"/>
