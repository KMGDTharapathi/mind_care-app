org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.vfs.watch=false
# The project lives on F: but the pub cache is on C:. Kotlin's incremental
# compiler resolves plugin sources relative to the Android root and throws
# "this and base files have different roots", crashing the daemon.
kotlin.incremental=false
# Compile Kotlin inside the Gradle daemon instead of spawning a second JVM,
# which does not fit alongside it on this machine.
kotlin.compiler.execution.strategy=in-process
systemProp.http.socketTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.http.connectionTimeout=120000
systemProp.https.connectionTimeout=120000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
