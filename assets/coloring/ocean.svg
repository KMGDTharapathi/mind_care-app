  <path d="M0 260 Q40 250 80 260 Q120 270 160 260 Q200 250 240 260 Q280 270 320 260 Q360 250 400 260" stroke="white" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M0 300 Q60 288 120 300 Q180 312 240 300 Q300 288 360 300 Q380 306 400 300" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M0 350 Q50 338 100 350 Q150 362 200 350 Q250 338 300 350 Q350 362 400 350" stroke="white" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M0 400 Q70 388 140 400 Q210 412 280 400 Q340 388 400 400" stroke="white" stroke-width="1.5" fill="none" opacity="0.3"/>
