  <line x1="145" y1="80" x2="130" y2="80" stroke="#F9A825" stroke-width="2"/>
  <line x1="255" y1="80" x2="270" y2="80" stroke="#F9A825" stroke-width="2"/>
  <line x1="161" y1="41" x2="150" y2="30" stroke="#F9A825" stroke-width="2"/>
  <line x1="239" y1="41" x2="250" y2="30" stroke="#F9A825" stroke-width="2"/>
