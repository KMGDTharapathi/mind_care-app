  <path d="M160 215 L240 215 L250 230 L150 230Z" fill="#4E342E" stroke="#3E2723" stroke-width="1"/>
  <line x1="200" y1="215" x2="200" y2="175" stroke="#4E342E" stroke-width="2"/>
  <path d="M200 175 L200 195 L230 195Z" fill="#EF9A9A" stroke="#C62828" stroke-width="1"/>
